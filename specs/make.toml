#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
deps = ["curl", "cc"]
check = { dev_tool = true }
# zig ar lacks the u flag of the default ARFLAGS, configure wants a linker in LD, and it would try
# gcc first, a stub on macOS without developer tools
post_install = '''
cd "$CONTENT"
export ARFLAGS=cr CC=cc LD=cc
./configure --disable-nls --disable-dependency-tracking --without-guile >/dev/null
sh build.sh >/dev/null
cp make "$PREFIX/bin/make"
'''

test = "{{ cmd }} --version"
[external]
brew = "make"
apt = "make"
apk = "make"
dnf = "make"
yum = "make"

[release]
type = "command"
cmd = """
curl -fsSL https://ftp.gnu.org/gnu/make/ |
  grep -o 'make-[0-9.]*[.]tar.gz"' |
  sed 's/^make-//; s/[.]tar.gz"$//' |
  sort -t. -k1,1n -k2,2n -k3,3n |
  tail -n 1
"""

[download]
type = "url"
url = "https://ftp.gnu.org/gnu/make/{{ asset }}"

[assets]
glibc_x64 = "make-{{ version }}.tar.gz"
glibc_arm64 = "make-{{ version }}.tar.gz"
musl_x64 = "make-{{ version }}.tar.gz"
musl_arm64 = "make-{{ version }}.tar.gz"
macos_arm64 = "make-{{ version }}.tar.gz"
