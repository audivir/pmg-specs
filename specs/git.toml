#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
# git finds libexec and share relative to its binary, so the whole archive is the package dir; macOS
# gives git the path of the symlink it was run by, so there bin links to wrappers running the binary
content = true
links.git = "{{ dir }}/links/git"
links.git-receive-pack = "{{ dir }}/links/git-receive-pack"
links.git-upload-archive = "{{ dir }}/links/git-upload-archive"
links.git-upload-pack = "{{ dir }}/links/git-upload-pack"
post_install = '''
mkdir "$CONTENT/links"
for cmd in git git-receive-pack git-upload-archive git-upload-pack; do
  if [ "$(uname)" = Darwin ]; then
    printf '#!/bin/sh\nreal="$(realpath "$0")"\nexec "${real%%/links/*}/bin/%s" "$@"\n' "$cmd" >"$CONTENT/links/$cmd"
    chmod +x "$CONTENT/links/$cmd"
  else
    ln -s "../bin/$cmd" "$CONTENT/links/$cmd"
  fi
done
'''
man = ["share/man/man1/*.1", "share/man/man5/*.5", "share/man/man7/*.7"]
# not the zsh completion of git, a wrapper of the bash one, as zsh ships a better one
completions.git = { bash = "share/bash-completion/completions/git" }
check = { dev_tool = true }

test = '{{ cmd }} init -q repo && {{ cmd }} -C repo status'
[external]
brew = "git"
apt = "git ca-certificates"
apk = "git"
dnf = "git"
yum = "git"

[release]
type = "github"
repo = "audivir/git-static"

[download]
type = "github"

[assets]
glibc_x64 = "git-static-linux-amd64.tar.gz"
glibc_arm64 = "git-static-linux-arm64.tar.gz"
musl_x64 = "git-static-linux-musl-amd64.tar.gz"
musl_arm64 = "git-static-linux-musl-arm64.tar.gz"
macos_arm64 = "git-static-macos-arm64.tar.gz"
