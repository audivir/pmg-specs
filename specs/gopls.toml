#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# gopls has no release binaries, so go builds it
deps = ["go"]
check = { args = ["version"] }

test = "{{ cmd }} version"
[external]
brew = "gopls"
apt = "gopls"
apk = "gopls"
# not dnf, whose EPEL lacks it, nor yum, which lacks it

[release]
type = "go"
module = "golang.org/x/tools/gopls"

[download]
type = "go"
