#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
# the musl loader, which is also the libc, runs dynamic musl programs on glibc hosts; they need
# `patchelf --set-interpreter {{ dir }}/lib/ld-musl-{{ arch }}.so.1`
platforms = ["glibc_x64", "glibc_arm64"]
deps = ["patchelf"]
content = true
keep = ["lib/ld-musl-*.so.1"]
check = { files = ["/lib/ld-musl-{{ arch }}.so.1"] }

test = 'test -x "{{ dir }}/lib/ld-musl-{{ arch }}.so.1"'
[external]
# only apt, as the package is only for glibc hosts and dnf and yum lack it
apt = "musl"

[release]
type = "apk"
package = "musl"

[download]
type = "apk"
packages = ["musl"]
