#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# a plugin of docker, which only looks in ~/.docker/cli-plugins, the dirs of cliPluginsExtraDirs in
# ~/.docker/config.json (e.g. ~/.local/bin), and the system ones; it also runs as docker-buildx
bin = { docker-buildx = "{{ asset }}" }
# there is no --version
check = { args = ["version"] }

test = "{{ cmd }} version"
[external]
brew = "docker-buildx"
# not apt, dnf, or yum, which only put it in the plugin dir of docker, nor apk, which lacks it

[release]
type = "github"
repo = "docker/buildx"

[download]
type = "github"

[assets]
glibc_x64 = "buildx-{{ tag }}.linux-amd64"
glibc_arm64 = "buildx-{{ tag }}.linux-arm64"
musl_x64 = "buildx-{{ tag }}.linux-amd64"
musl_arm64 = "buildx-{{ tag }}.linux-arm64"
macos_arm64 = "buildx-{{ tag }}.darwin-arm64"
