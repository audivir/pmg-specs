#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
min_glibc = "2.18"
bin = { fd = "fd" }
man = ["fd.1"]
completions.fd.zsh = "autocomplete/_fd"
completions.fd.bash = "autocomplete/fd.bash"
completions.fd.fish = "autocomplete/fd.fish"

test = "{{ cmd }} --version"
[external]
brew = "fd"
# not apt, which names the command fdfind
apk = "fd"
dnf = "fd-find"
# not yum, as CentOS 7 lacks it

[release]
type = "github"
repo = "sharkdp/fd"

[download]
type = "github"

[assets]
glibc_x64 = "fd-{{ tag }}-x86_64-unknown-linux-gnu.tar.gz"
glibc_arm64 = "fd-{{ tag }}-aarch64-unknown-linux-gnu.tar.gz"
musl_x64 = "fd-{{ tag }}-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "fd-{{ tag }}-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "fd-{{ tag }}-aarch64-apple-darwin.tar.gz"
