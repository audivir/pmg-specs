#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
# the AppImage of x86_64, which has glibc and its loader bundled, so it runs on musl hosts as well;
# there is none for other platforms
platforms = ["glibc_x64", "musl_x64"]
content = true
# AppRun finds its files from the path it was run by, so a wrapper in the package dir, which bin
# links to, resolves that link first
links.nvtop = "{{ dir }}/nvtop"
post_install = '''
cd "$CONTENT"
chmod +x ./*.AppImage
# extracting needs no FUSE
./*.AppImage --appimage-extract >/dev/null
rm ./*.AppImage
cat > nvtop <<'EOF'
#!/bin/sh
real="$(readlink -f "$0")"
exec "${real%/*}/squashfs-root/AppRun" "$@"
EOF
chmod +x nvtop
'''

test = "{{ cmd }} --version"
[external]
brew = "nvtop"
apt = "nvtop"
apk = "nvtop"
dnf = "nvtop"
# not yum, as neither CentOS 7 nor EPEL 7 has it

[release]
type = "github"
repo = "Syllo/nvtop"

[download]
type = "github"

[assets]
glibc_x64 = "nvtop-{{ version }}-x86_64.AppImage"
musl_x64 = "nvtop-{{ version }}-x86_64.AppImage"
