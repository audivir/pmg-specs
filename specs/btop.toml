#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the static musl builds of btop on Linux, which run on glibc and musl hosts alike, and the build
# of btop-static on macOS, which btop does not release; the version is the latest release of
# btop-static, which follows btop

platforms = [
  "glibc_x64",
  "glibc_arm64",
  "musl_x64",
  "musl_arm64",
  "macos_arm64",
]
# btop finds its themes at ../share/btop/themes from its real path, so the archive is the package
# dir and bin links into it
content = true
links.btop = "{{ dir }}/bin/btop"
# the archives of btop have the themes next to bin, the one of btop-static has them in share/btop
post_install = '''
if [ -d "$CONTENT/themes" ]; then
  mkdir -p "$CONTENT/share/btop"
  mv "$CONTENT/themes" "$CONTENT/share/btop/themes"
fi
'''

test = '{{ cmd }} --version && test -s "{{ dir }}/share/btop/themes/dracula.theme"'

[external]
brew = "btop"
apt = "btop"
apk = "btop"
dnf = "btop"
# not yum, as neither CentOS 7 nor EPEL 7 has it

[release]
type = "github"
repo = "zshsetup/btop-static"

[download]
type = "url"
url = "{{ asset }}"

[assets]
glibc_x64 = "https://github.com/aristocratos/btop/releases/download/{{ tag }}/btop-x86_64-unknown-linux-musl.tar.gz"
glibc_arm64 = "https://github.com/aristocratos/btop/releases/download/{{ tag }}/btop-aarch64-unknown-linux-musl.tar.gz"
musl_x64 = "https://github.com/aristocratos/btop/releases/download/{{ tag }}/btop-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "https://github.com/aristocratos/btop/releases/download/{{ tag }}/btop-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "https://github.com/zshsetup/btop-static/releases/download/{{ tag }}/btop-static-macos-arm64.tar.gz"
