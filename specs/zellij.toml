#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
bin = { zellij = "zellij" }
completions.zellij.zsh.cmd = "zellij setup --generate-completion zsh"
completions.zellij.bash.cmd = "zellij setup --generate-completion bash"
completions.zellij.fish.cmd = "zellij setup --generate-completion fish"

test = "{{ cmd }} --version"
[external]
brew = "zellij"
# not apt, dnf, or yum, which lack it
apk = "zellij"

[release]
type = "github"
repo = "zellij-org/zellij"

[download]
type = "github"

[assets]
glibc_x64 = "zellij-x86_64-unknown-linux-musl.tar.gz"
glibc_arm64 = "zellij-aarch64-unknown-linux-musl.tar.gz"
musl_x64 = "zellij-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "zellij-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "zellij-aarch64-apple-darwin.tar.gz"
