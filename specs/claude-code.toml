#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
# min_glibc = "2.26"
# the release and download commands use curl, and the binary is zstd-compressed
deps = ["curl", "zstd"]
check = { cmd = ["claude"] }

test = "{{ cmd }} --version"
[external]
brew = "claude-code"
# not on apk, others not checked yet

[release]
type = "command"
cmd = "curl -fsSL https://downloads.claude.ai/claude-code-releases/latest"

[download]
type = "command"
cmd = '''
curl -fsSL "https://downloads.claude.ai/claude-code-releases/{{ version }}/{{ asset }}/claude.zst" |
  zstd -d -o "$PREFIX/bin/claude"
chmod +x "$PREFIX/bin/claude"
'''

[assets]
glibc_x64 = "linux-x64"
glibc_arm64 = "linux-arm64"
musl_x64 = "linux-x64-musl"
musl_arm64 = "linux-arm64-musl"
macos_arm64 = "darwin-arm64"
