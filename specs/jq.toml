#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
bin = { jq = "{{ asset }}" }

test = '''test "$(echo '{"a": 1}' | {{ cmd }} .a)" = 1'''
[external]
brew = "jq"
apt = "jq"
apk = "jq"
dnf = "jq"
yum = "jq"

[release]
type = "github"
repo = "jqlang/jq"

[download]
type = "github"

[assets]
glibc_x64 = "jq-linux-amd64"
glibc_arm64 = "jq-linux-arm64"
musl_x64 = "jq-linux-amd64"
musl_arm64 = "jq-linux-arm64"
macos_arm64 = "jq-macos-arm64"
