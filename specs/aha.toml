#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
bin = { aha = "bin/aha" }
man = ["share/man/man1/aha.1"]

test = 'test "$(echo pmg | {{ cmd }} --no-header)" = "pmg"'
[external]
brew = "aha"
apt = "aha"
apk = "aha"
dnf = "aha"
# not yum, as neither CentOS 7 nor EPEL 7 has it

[release]
type = "github"
repo = "audivir/aha-static"

[download]
type = "github"

[assets]
glibc_x64 = "aha-static-linux-amd64.tar.gz"
glibc_arm64 = "aha-static-linux-arm64.tar.gz"
musl_x64 = "aha-static-linux-musl-amd64.tar.gz"
musl_arm64 = "aha-static-linux-musl-arm64.tar.gz"
macos_arm64 = "aha-static-macos-arm64.tar.gz"
