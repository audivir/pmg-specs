#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# libstdc++ and libgcc_s of GCC for musl hosts without them, e.g. for bun and Rust

platforms = ["musl_x64", "musl_arm64"]
# older releases lack symbols of libstdc++ that bun needs; there is no check, as one would accept
# the old libstdc++ of the host
min_alpine = "3.17"
deps = ["patchelf"]
content = true
keep = ["usr/lib/libstdc++.so.6*", "usr/lib/libgcc_s.so.1"]
# musl looks up the dependencies of a library in the RUNPATH of that library
post_install = """patchelf --set-rpath '$ORIGIN' "$PREFIX"/dir/usr/lib/libstdc++.so.6.*"""

test = 'test -f "{{ dir }}/usr/lib/libstdc++.so.6" && test -f "{{ dir }}/usr/lib/libgcc_s.so.1"'

[external]
# only apk, as the package is only for musl hosts
apk = "libstdc++"

[release]
type = "apk"
package = "libstdc++"

[download]
type = "apk"
packages = ["libstdc++", "libgcc"]

[assets]
