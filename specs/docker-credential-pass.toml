#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the credential helper of docker for pass, which docker finds in PATH when credsStore in
# ~/.docker/config.json is pass; it runs the pass command, which it does not install
bin = { docker-credential-pass = "{{ asset }}" }
# there is no --version
check = { args = ["version"] }

test = "{{ cmd }} version"
[external]
brew = "docker-credential-helper"
# not apt, apk, dnf, or yum, which lack it

[release]
type = "github"
repo = "docker/docker-credential-helpers"

[download]
type = "github"

[assets]
glibc_x64 = "docker-credential-pass-{{ tag }}.linux-amd64"
glibc_arm64 = "docker-credential-pass-{{ tag }}.linux-arm64"
musl_x64 = "docker-credential-pass-{{ tag }}.linux-amd64"
musl_arm64 = "docker-credential-pass-{{ tag }}.linux-arm64"
macos_arm64 = "docker-credential-pass-{{ tag }}.darwin-arm64"
