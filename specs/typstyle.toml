#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the release has no musl build for arm64, and its glibc build of arm64 needs glibc 2.34; x64 is
# statically linked

min_glibc = "2.34"
platforms = ["glibc_x64", "glibc_arm64", "musl_x64", "macos_arm64"]
bin = { typstyle = "{{ asset }}" }
completions.typstyle.zsh.cmd = "typstyle completions zsh"
completions.typstyle.bash.cmd = "typstyle completions bash"
completions.typstyle.fish.cmd = "typstyle completions fish"

test = "{{ cmd }} --version"

[external]
brew = "typstyle"
# not apt, apk, dnf, or yum, which lack it

[release]
type = "github"
repo = "typstyle-rs/typstyle"

[download]
type = "github"

[assets]
glibc_x64 = "typstyle-x86_64-unknown-linux-musl"
glibc_arm64 = "typstyle-aarch64-unknown-linux-gnu"
musl_x64 = "typstyle-x86_64-unknown-linux-musl"
macos_arm64 = "typstyle-aarch64-apple-darwin"
