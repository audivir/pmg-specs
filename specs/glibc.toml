#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
# user-space glibc for musl hosts, from the sysroot conda-forge builds against; glibc programs need
# `patchelf --set-interpreter {{ dir }}/loader`; older glibc hosts count as musl hosts, so that it
# also serves the musl assets they get through min_glibc
platforms = ["musl_x64", "musl_arm64"]
min_glibc = "2.39"
deps = ["patchelf"]
content = "*-conda-linux-gnu/sysroot"
# only the shared libraries are needed at runtime; glibc reads locales and gconv modules from the
# host's /usr/lib/locale and /usr/lib64/gconv, not from here
remove = [
  "lib64/locale",
  "lib64/gconv",
  "lib64/*.a",
  "lib64/*.o",
  "usr/include",
  "usr/share",
]
post_install = 'cd "$PREFIX/dir" && ln -s lib64/ld-linux-*.so.* loader'

test = '"{{ dir }}/loader" --version'
[external]
# none, as musl hosts have no glibc package

[release]
type = "conda"
channel = "conda-forge"

[download]
type = "conda"
channel = "conda-forge"

[assets]
musl_x64 = "sysroot_linux-64"
musl_arm64 = "sysroot_linux-aarch64"
