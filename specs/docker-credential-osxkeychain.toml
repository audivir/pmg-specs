#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the credential helper of docker for the keychain of macOS, which docker finds in PATH when
# credsStore in ~/.docker/config.json is osxkeychain

platforms = ["macos_arm64"]
bin = { docker-credential-osxkeychain = "{{ asset }}" }
# there is no --version
check = { args = ["version"] }

test = "{{ cmd }} version"

[external]
brew = "docker-credential-helper"
# not apt, apk, dnf, or yum, which are not for macOS

[release]
type = "github"
repo = "docker/docker-credential-helpers"

[download]
type = "github"

[assets]
macos_arm64 = "docker-credential-osxkeychain-{{ tag }}.darwin-arm64"
