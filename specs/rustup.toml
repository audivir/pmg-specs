#:schema https://raw.githubusercontent.com/audivir/pmg/main/schema.json
# rustup updates itself and its toolchains, so pmg owns the dirs rather than their files;
# cargo install adds binaries to cargo/bin, which is why it is a PATH entry instead of links

# the release and download commands use curl, Rust links with cc, and on musl needs libgcc_s
deps = ["curl", "cc", "musl-libs"]
dirs = { cargo = "{{ data }}/cargo" }
env = { RUSTUP_HOME = "{{ dir }}", CARGO_HOME = "{{ dirs.cargo }}" }
# the toolchains link libgcc_s, which bare musl hosts only have from musl-libs
prepend.LD_LIBRARY_PATH = ["{% if deps['musl-libs'].dir %}{{ deps['musl-libs'].dir }}/usr/lib{% endif %}"]
paths = ["{{ dirs.cargo }}/bin"]
upgrade = "{{ dirs.cargo }}/bin/rustup self update"

test = '{{ cmd }} --version && {{ cmds.cargo }} --version && {{ cmds.rustc }} --version'
[external]
brew = "rustup"
apt = "rustup"
# not apk, whose package only has rustup-init

[release]
type = "command"
cmd = """
curl -fsSL https://static.rust-lang.org/rustup/release-stable.toml |
  awk -F"'" '/^version/ {print $2}'
"""

[download]
type = "command"
# the default profile without its offline docs, which take several hundred MB; PMG_RUST_TOOLCHAIN
# picks another toolchain than stable
cmd = '''
curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path \
  --default-toolchain "${PMG_RUST_TOOLCHAIN:-stable}" --profile minimal \
  --component rustfmt,clippy --no-update-default-toolchain
'''

[assets]
