#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the npm package has no release binaries, and bun runs its script instead of node

deps = ["bun"]
content = true
bin = { yaml-language-server = "bin/yaml-language-server" }

test = "{{ cmd }} --version"

[external]
brew = "yaml-language-server"
# not apt, dnf, or yum, which lack it, nor apk, which only has it in edge

[release]
type = "npm"

[download]
type = "npm"

[assets]
glibc_x64 = "yaml-language-server"
glibc_arm64 = "yaml-language-server"
musl_x64 = "yaml-language-server"
musl_arm64 = "yaml-language-server"
macos_arm64 = "yaml-language-server"
