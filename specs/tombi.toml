#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json
# the Linux builds are static musl builds, which run on glibc hosts, too

bin = { tombi = "tombi" }
completions.tombi.zsh.cmd = "tombi completion zsh"
completions.tombi.bash.cmd = "tombi completion bash"
completions.tombi.fish.cmd = "tombi completion fish"

test = "{{ cmd }} --version"

[external]
brew = "tombi"
# not apt, apk, dnf, or yum, which lack it

[release]
type = "github"
repo = "tombi-toml/tombi"

[download]
type = "github"

[assets]
glibc_x64 = "tombi-cli-{{ version }}-x86_64-unknown-linux-musl.tar.gz"
glibc_arm64 = "tombi-cli-{{ version }}-aarch64-unknown-linux-musl.tar.gz"
musl_x64 = "tombi-cli-{{ version }}-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "tombi-cli-{{ version }}-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "tombi-cli-{{ version }}-aarch64-apple-darwin.tar.gz"
